name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build --configuration Release
      - name: Test MCP stdio contract
        run: python3 tests/stdio_smoke.py dotnet bin/Release/net8.0/GuidMcp.dll
      - name: Publish Native AOT
        run: dotnet publish --configuration Release --runtime linux-x64 --output artifacts/native
      - name: Test Native AOT MCP stdio contract
        run: python3 tests/stdio_smoke.py ./artifacts/native/GuidMcp
